on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }} # Added environment variable
  SANITY_PROJECT_ID: ${{ secrets.SANITY_DATASET }} # Added environment variable

jobs:
  build_and_test:
    name: Rust project - latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v4
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - run: cargo build --verbose
      - run: cargo test --verbose
